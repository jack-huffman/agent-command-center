<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The CI runner's fonts for the screenshot run (D-203): the families the pages name, mapped to the
     closest ones Ubuntu has. Menlo is built on DejaVu Sans Mono, with its metrics. -->
<fontconfig>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Monaco</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
